<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Agent - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <h1>WhatsApp Business Agent</h1>
            <p class="subtitle">Atención al cliente 24/7 con IA</p>

            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="login-tab" class="auth-form active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary">Inicia Sesión</button>
                </form>
                <p class="form-message" id="login-message"></p>
            </div>

            <!-- REGISTER FORM -->
            <div id="register-tab" class="auth-form">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="register-name" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="register-email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="register-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary">Crear Cuenta</button>
                </form>
                <p class="form-message" id="register-message"></p>
            </div>

            <div class="auth-footer">
                <p>Plan Gratuito • 1 negocio • 100 mensajes/día</p>
                <p class="small">Actualiza a Pro o Enterprise para más funcionalidades</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Verificar si ya está autenticado
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/dashboard.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('login-message');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    msg.textContent = '✓ Iniciando sesión...';
                    msg.className = 'form-message success';
                    setTimeout(() => window.location.href = '/dashboard.html', 1500);
                } else {
                    msg.textContent = '✗ ' + data.detail;
                    msg.className = 'form-message error';
                }
            } catch (error) {
                msg.textContent = '✗ Error: ' + error.message;
                msg.className = 'form-message error';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const msg = document.getElementById('register-message');

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, name })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    msg.textContent = '✓ Cuenta creada! Redirigiendo...';
                    msg.className = 'form-message success';
                    setTimeout(() => window.location.href = '/dashboard.html', 1500);
                } else {
                    msg.textContent = '✗ ' + data.detail;
                    msg.className = 'form-message error';
                }
            } catch (error) {
                msg.textContent = '✗ Error: ' + error.message;
                msg.className = 'form-message error';
            }
        }
    </script>
</body>
</html>
